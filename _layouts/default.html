<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2c2930">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}Franzzz Co.</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/blog/blog.css">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20261124c">
</head>
<body class="page-blog">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Franzzz Co. início"><span>franzzz<span class="brand-dot">.</span></span><small>CO.</small></a>
    <nav aria-label="Navegação principal">
      <a href="/">Início</a><a href="/cases.html">Cases</a><a class="active" href="/blog/">Blog</a><a class="nav-contact" href="/#contato">Vamos conversar ↗</a>
    </nav>
  </header>
  {{ content }}
  <footer class="site-footer">
    <a class="brand" href="/"><span>franzzz<span class="brand-dot">.</span></span><small>CO.</small></a>
    <p>Ideias, estratégia e movimento para negócios que querem crescer.</p>
    <a href="/#contato">Vamos conversar ↗</a>
    <small>© {{ 'now' | date: '%Y' }} Franzzz Co. Todos os direitos reservados.</small>
  </footer>
</body>
</html>
